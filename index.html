<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f172a" />

    <title>LokalGrp.dev — Software Engineering Group</title>
    <meta
      name="description"
      content="LokalGrp.dev is a software engineering group building fast, reliable web and cross-platform applications with React, Node.js and Linux."
    />

    <!-- TODO: set this to the deployed URL so social cards resolve absolute asset paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LokalGrp.dev" />
    <meta property="og:title" content="LokalGrp.dev — Software Engineering Group" />
    <meta
      property="og:description"
      content="A small software team building fast, reliable web and cross-platform applications."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LokalGrp.dev — we build fast, reliable software for the web." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LokalGrp.dev — Software Engineering Group" />
    <meta
      name="twitter:description"
      content="A small software team building fast, reliable web and cross-platform applications."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <script>
      // Apply the stored theme before first paint so the page never flashes
      // the wrong one. Kept in sync with src/components/ThemeToggle.jsx.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {
          /* localStorage unavailable (private mode) — fall back to the OS theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
